name: Build CI

on:
  push:

jobs:
  pre-commit:
    name: "Pre-commit (lint + format + typecheck)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - uses: pre-commit/action@v3.0.1

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run type check
        run: uv run mypy

  unit-test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: ["pre-commit", "typecheck"]
    strategy:
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run unittests
        run: uv run pytest
