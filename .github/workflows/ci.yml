name: Build CI

on:
  push:

jobs:
  pre-commit:
    name: "Pre-commit (lint + format + typecheck)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - uses: pre-commit/action@v3.0.1

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run type check
        run: uv run mypy

  unit-test:
    name: "Unit Test"
    runs-on: ubuntu-latest
    needs: ["pre-commit", "typecheck"]
    strategy:
      matrix:
        python-version: ["3.13"]
        texlive-version: ["2026"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --all-groups
      - name: Run unittests
        run: uv run pytest

  # --- Release pipeline: only runs for v* tags pointing at a commit on main ---

  guard:
    name: "Release prerequisite: version tagged main"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $GITHUB_REF_NAME is not on main, skipping."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  changelog:
    name: "Update changelog"
    needs: ["guard", "unit-test"]
    if: needs.guard.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Runs on the tagged commit, so the new tag is the newest release section.
      # Output goes to a temp name so switching branches can't clash with an
      # existing CHANGELOG.md.
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.generated.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          mv CHANGELOG.generated.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog unchanged."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(changelog): update for $GITHUB_REF_NAME [skip ci]"
          git push origin main

  deploy:
    name: "Create release"
    needs: ["guard", "unit-test"]
    if: needs.guard.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Tags like v1.2.0-rc.1 are published as pre-releases
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            $flags
